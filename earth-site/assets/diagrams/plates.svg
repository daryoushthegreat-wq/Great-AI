    <text x="170" y="16" font-family="ui-rounded, Segoe UI, system-ui, sans-serif" font-size="9" fill="#24303a" text-anchor="middle" font-weight="700">Ocean trench</text><text x="170" y="28" font-family="ui-rounded, Segoe UI, system-ui, sans-serif" font-size="9" fill="#24303a" text-anchor="middle" font-size="7.5">one plate sinks</text>
