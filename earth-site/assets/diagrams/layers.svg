    <line x1="118" y1="13" x2="233" y2="13" stroke="#24303a" stroke-width="0.6"/><text x="236" y="16" font-family="ui-rounded, Segoe UI, system-ui, sans-serif" font-size="9" fill="#24303a" font-weight="700" font-size="8.5">Crust (thin, cool)</text>
