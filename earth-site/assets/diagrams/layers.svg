    <line x1="118" y1="46" x2="233" y2="46" stroke="#24303a" stroke-width="0.6"/><text x="236" y="49" font-family="ui-rounded, Segoe UI, system-ui, sans-serif" font-size="9" fill="#24303a" font-weight="700" font-size="8.5">Mantle: solid, churning</text>
    <line x1="118" y1="72" x2="233" y2="72" stroke="#24303a" stroke-width="0.6"/><text x="236" y="75" font-family="ui-rounded, Segoe UI, system-ui, sans-serif" font-size="9" fill="#24303a" font-weight="700" font-size="8.5">Outer core: liquid iron</text>
    <line x1="118" y1="114" x2="233" y2="114" stroke="#24303a" stroke-width="0.6"/><text x="236" y="117" font-family="ui-rounded, Segoe UI, system-ui, sans-serif" font-size="9" fill="#24303a" font-weight="700" font-size="8.5">Inner core: solid</text>
