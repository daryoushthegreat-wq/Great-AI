# Foxguard: the free static analyzer from 0security (https://github.com/0sec-labs/0security).
# No AI model or API key needed. Runs a code scan and a secrets scan;
# code findings are uploaded to Security > Code scanning.
name: Foxguard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FOXGUARD_URL: https://github.com/0sec-labs/0security/releases/download/v0.46.0/foxguard-linux-x64
  FOXGUARD_SHA256: 22b024ccf52471c0dd84ebcfaa98e1d27fb1df5679dd019bf5393f763b0d5b09

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install foxguard (pinned, checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/foxguard" "$FOXGUARD_URL"
          echo "$FOXGUARD_SHA256  $RUNNER_TEMP/foxguard" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/foxguard"

      - name: Code scan (SARIF)
        run: '"$RUNNER_TEMP/foxguard" . --format sarif > foxguard.sarif'

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@e274593ecfcbcdc39c8f034978d84614cebcb71d # v4.39.5
        with:
          sarif_file: foxguard.sarif
          category: foxguard

      - name: Secrets scan
        run: '"$RUNNER_TEMP/foxguard" secrets .'
